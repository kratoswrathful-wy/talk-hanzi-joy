# Gate2 / P0：GitHub runner 本機 Supabase PostgreSQL 17（不得連 production／不得建 Micro）
# - feat/isolation-replay-20260901：完整 Gate1 隔離套件（既有）
# - ops/gate2-maint-write-acl-20260905：定向維護 ACL（不重跑完整 Gate1／全 Playwright）
# - fix/case-buttons-20260908：任務完成／deferred dispatch 定向套件（承 #84）
name: P0 isolated DB (local PG17)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/isolation-replay-20260901
      - ops/gate2-maint-write-acl-20260905
      - fix/case-buttons-20260908
  workflow_dispatch:
    inputs:
      suite:
        description: "full | maint-acl | tool-ui | copy-tools | pm-complete（預設依分支）"
        required: false
        default: ""

concurrency:
  group: p0-isolated-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-isolation:
    name: Local Supabase PG17 isolation suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'feat/isolation-replay-20260901' ||
      github.ref_name == 'ops/gate2-maint-write-acl-20260905' ||
      github.ref_name == 'fix/case-buttons-20260908' ||
      github.head_ref == 'feat/isolation-replay-20260901' ||
      github.head_ref == 'ops/gate2-maint-write-acl-20260905' ||
      github.head_ref == 'fix/case-buttons-20260908'
    env:
      PRODUCTION_REF: wshsmerltcakffllgyul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve suite + expected migrations
        id: meta
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          HEAD_REF="${GITHUB_HEAD_REF:-}"
          INPUT_SUITE="${{ github.event.inputs.suite || '' }}"
          SUITE=""
          if [ -n "${INPUT_SUITE}" ]; then
            SUITE="${INPUT_SUITE}"
          elif [ "${REF}" = "ops/gate2-maint-write-acl-20260905" ] || [ "${HEAD_REF}" = "ops/gate2-maint-write-acl-20260905" ]; then
            SUITE="maint-acl"
          elif [ "${REF}" = "fix/case-buttons-20260908" ] || [ "${HEAD_REF}" = "fix/case-buttons-20260908" ]; then
            SUITE="pm-complete"
          else
            SUITE="full"
          fi
          if [ "${SUITE}" = "tool-ui" ] || [ "${SUITE}" = "copy-tools" ]; then
            # tool-ui＝#85；copy-tools＝複製案件工具。皆用 gate2 maint ACL 基準。
            echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"
            echo "expected_count=167" >> "$GITHUB_OUTPUT"
            echo "expected_max=20260905120000" >> "$GITHUB_OUTPUT"
          elif [ "${SUITE}" = "maint-acl" ]; then
            echo "suite=maint-acl" >> "$GITHUB_OUTPUT"
            echo "expected_count=167" >> "$GITHUB_OUTPUT"
            echo "expected_max=20260905120000" >> "$GITHUB_OUTPUT"
          elif [ "${SUITE}" = "pm-complete" ]; then
            # pm-complete＝任務完成雙路徑（含新 migration 20260907120000）
            echo "suite=pm-complete" >> "$GITHUB_OUTPUT"
            echo "expected_count=168" >> "$GITHUB_OUTPUT"
            echo "expected_max=20260907120000" >> "$GITHUB_OUTPUT"
          else
            echo "suite=full" >> "$GITHUB_OUTPUT"
            echo "expected_count=166" >> "$GITHUB_OUTPUT"
            echo "expected_max=20260904004224" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved_suite=${SUITE}"
          echo "ref_name=${REF}"

      - name: Guard — refuse production credentials / refs
        run: |
          set -euo pipefail
          echo "git_sha=${GITHUB_SHA}"
          echo "suite=${{ steps.meta.outputs.suite }}"
          echo "expected_migrations=${{ steps.meta.outputs.expected_count }}"
          echo "expected_max_version=${{ steps.meta.outputs.expected_max }}"
          echo "remote Supabase access disabled"
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must not be set"
            exit 1
          fi
          if [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF must not be set"
            exit 1
          fi
          for v in \
            "${VITE_SUPABASE_URL:-}" \
            "${SUPABASE_URL:-}" \
            "${NEXT_PUBLIC_SUPABASE_URL:-}"
          do
            if echo "$v" | grep -Eqi "${PRODUCTION_REF}"; then
              echo "::error::production ref detected in env"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify CLI syntax (no guessing)
        run: |
          set -euo pipefail
          supabase --version
          supabase --help >/dev/null
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase db query --help >/dev/null
          supabase migration list --help >/dev/null
          supabase status --help >/dev/null
          supabase stop --help >/dev/null
          supabase gen types --help >/dev/null
          supabase db advisors --help >/dev/null
          supabase functions serve --help >/dev/null

      - name: Assert config.toml major_version = 17
        run: |
          set -euo pipefail
          grep -q 'major_version = 17' supabase/config.toml
          echo "postgres_major_version_config=17"

      - name: Install psql client (multi-statement SQL tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Start local Supabase (PostgreSQL 17)
        id: start
        run: |
          set -euo pipefail
          supabase start
          PG_VER=$(supabase db query --local "show server_version;" -o csv | tail -n 1 | tr -d '"' | cut -d. -f1)
          echo "postgres_major=${PG_VER}"
          echo "postgres_major=${PG_VER}" >> "$GITHUB_OUTPUT"
          if [ "${PG_VER}" != "17" ]; then
            echo "::error::CLI started PostgreSQL ${PG_VER}, expected 17 — refusing to downgrade"
            exit 1
          fi

      - name: Replay migrations from zero (db reset --local)
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          COUNT=$(supabase db query --local "select count(*)::text from supabase_migrations.schema_migrations;" -o csv | tail -n 1 | tr -d '"')
          MAXV=$(supabase db query --local "select max(version) from supabase_migrations.schema_migrations;" -o csv | tail -n 1 | tr -d '"')
          echo "migration_count=${COUNT}"
          echo "migration_max=${MAXV}"
          test "${COUNT}" = "${{ steps.meta.outputs.expected_count }}"
          test "${MAXV}" = "${{ steps.meta.outputs.expected_max }}"

      - name: P0 SQL suite 11/11 (full only)
        if: steps.meta.outputs.suite == 'full'
        run: node scripts/isolation-run-p0-sql.mjs

      - name: Gate2 maint ACL directional SQL + affected ACL regression
        if: steps.meta.outputs.suite == 'maint-acl'
        run: node scripts/isolation-run-gate2-maint-acl.mjs

      - name: Task-complete directional SQL + dispatch trigger
        if: steps.meta.outputs.suite == 'pm-complete'
        run: node scripts/isolation-run-pm-complete.mjs

      - name: Capture local API endpoints (masked)
        if: steps.meta.outputs.suite == 'full' || steps.meta.outputs.suite == 'tool-ui' || steps.meta.outputs.suite == 'copy-tools' || steps.meta.outputs.suite == 'pm-complete'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iso-keys"
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          node scripts/isolation-read-local-status.mjs "$RUNNER_TEMP/supabase.env" "$RUNNER_TEMP/iso-keys"

      - name: Provision race users + dual-client race
        if: steps.meta.outputs.suite == 'full'
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs micro3 "$RUNNER_TEMP/iso-keys")
          echo "race_creds_file_written=1"
          export MICRO3_RACE_CREDS_FILE="$CREDS"
          node scripts/dual-client-collab-race.mjs
          rm -f "$CREDS" || true

      - name: Data API / definer helper contract
        if: steps.meta.outputs.suite == 'full'
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs micro3 "$RUNNER_TEMP/iso-keys")
          API_CREDS=$(mktemp)
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            fs.writeFileSync(process.argv[2], JSON.stringify({
              url:c.url, anonKey:c.anonKey, member:c.m1
            }));
            try { fs.unlinkSync(process.argv[1]); } catch {}
          ' "$CREDS" "$API_CREDS"
          chmod 600 "$API_CREDS"
          export MICRO3_API_CREDS_FILE="$API_CREDS"
          node scripts/micro3-definer-view-api-check.mjs
          rm -f "$API_CREDS" || true

      - name: Provision Playwright test personas
        if: steps.meta.outputs.suite == 'full' || steps.meta.outputs.suite == 'tool-ui' || steps.meta.outputs.suite == 'copy-tools' || steps.meta.outputs.suite == 'pm-complete'
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs personas "$RUNNER_TEMP/iso-keys")
          node -e '
            const fs=require("fs");
            const path=require("path");
            const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const dir=process.argv[2];
            const write=(name,val)=>{ fs.writeFileSync(path.join(dir,name), val); };
            write("playwright-password.txt", c.exec.password);
            write("playwright-email.txt", c.exec.email);
            write("iso-exec-email.txt", c.exec.email);
            write("iso-exec-password.txt", c.exec.password);
            write("iso-pm-email.txt", c.pm.email);
            write("iso-pm-password.txt", c.pm.password);
            write("iso-t1-email.txt", c.t1.email);
            write("iso-t1-password.txt", c.t1.password);
            write("iso-t2-email.txt", c.t2.email);
            write("iso-t2-password.txt", c.t2.password);
            try { fs.unlinkSync(process.argv[1]); } catch {}
          ' "$CREDS" "$RUNNER_TEMP"
          chmod 600 "$RUNNER_TEMP"/playwright-password.txt "$RUNNER_TEMP"/iso-*-password.txt

      - name: Install Playwright Chromium
        if: steps.meta.outputs.suite == 'full' || steps.meta.outputs.suite == 'tool-ui' || steps.meta.outputs.suite == 'copy-tools' || steps.meta.outputs.suite == 'pm-complete'
        run: npx playwright install --with-deps chromium

      - name: Tool credentials UI + backend readback (#85, local only)
        if: steps.meta.outputs.suite == 'tool-ui'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_ENTER_TEST_MODE: "1"
          PLAYWRIGHT_TOOL_CREDENTIALS_UI: "1"
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          export PLAYWRIGHT_TEST_EMAIL="$(cat "$RUNNER_TEMP/playwright-email.txt")"
          export PLAYWRIGHT_TEST_PASSWORD="$(cat "$RUNNER_TEMP/playwright-password.txt")"
          if echo "${VITE_SUPABASE_URL}" | grep -Eqi "${PRODUCTION_REF}"; then
            echo "::error::Playwright URL is production"
            exit 1
          fi
          if ! echo "${VITE_SUPABASE_URL}" | grep -Eqi '^https?://(127\.0\.0\.1|localhost)'; then
            echo "::error::Playwright URL is not local loopback"
            exit 1
          fi
          npx playwright test tests/tool-credentials-persist-ui.spec.ts --project=chromium

      - name: Upload tool-ui Playwright report
        if: always() && steps.meta.outputs.suite == 'tool-ui'
        uses: actions/upload-artifact@v4
        with:
          name: tool-ui-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Case copy tools UI + backend readback (local only)
        if: steps.meta.outputs.suite == 'copy-tools'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_ENTER_TEST_MODE: "1"
          PLAYWRIGHT_TOOL_CREDENTIALS_UI: "1"
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          export PLAYWRIGHT_TEST_EMAIL="$(cat "$RUNNER_TEMP/playwright-email.txt")"
          export PLAYWRIGHT_TEST_PASSWORD="$(cat "$RUNNER_TEMP/playwright-password.txt")"
          if echo "${VITE_SUPABASE_URL}" | grep -Eqi "${PRODUCTION_REF}"; then
            echo "::error::Playwright URL is production"
            exit 1
          fi
          if ! echo "${VITE_SUPABASE_URL}" | grep -Eqi '^https?://(127\.0\.0\.1|localhost)'; then
            echo "::error::Playwright URL is not local loopback"
            exit 1
          fi
          npx playwright test tests/case-copy-tools.spec.ts --project=chromium

      - name: Upload copy-tools Playwright report
        if: always() && steps.meta.outputs.suite == 'copy-tools'
        uses: actions/upload-artifact@v4
        with:
          name: copy-tools-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Case buttons UI + backend readback (local only)
        if: steps.meta.outputs.suite == 'pm-complete'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_CASE_BUTTONS_UI: "1"
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          export PLAYWRIGHT_TEST_EMAIL="$(cat "$RUNNER_TEMP/playwright-email.txt")"
          export PLAYWRIGHT_TEST_PASSWORD="$(cat "$RUNNER_TEMP/playwright-password.txt")"
          export PLAYWRIGHT_ISO_EXEC_EMAIL="$(cat "$RUNNER_TEMP/iso-exec-email.txt")"
          export PLAYWRIGHT_ISO_EXEC_PASSWORD="$(cat "$RUNNER_TEMP/iso-exec-password.txt")"
          export PLAYWRIGHT_ISO_PM_EMAIL="$(cat "$RUNNER_TEMP/iso-pm-email.txt")"
          export PLAYWRIGHT_ISO_PM_PASSWORD="$(cat "$RUNNER_TEMP/iso-pm-password.txt")"
          export PLAYWRIGHT_ISO_T1_EMAIL="$(cat "$RUNNER_TEMP/iso-t1-email.txt")"
          export PLAYWRIGHT_ISO_T1_PASSWORD="$(cat "$RUNNER_TEMP/iso-t1-password.txt")"
          export PLAYWRIGHT_ISO_T2_EMAIL="$(cat "$RUNNER_TEMP/iso-t2-email.txt")"
          export PLAYWRIGHT_ISO_T2_PASSWORD="$(cat "$RUNNER_TEMP/iso-t2-password.txt")"
          if echo "${VITE_SUPABASE_URL}" | grep -Eqi "${PRODUCTION_REF}"; then
            echo "::error::Playwright URL is production"
            exit 1
          fi
          if ! echo "${VITE_SUPABASE_URL}" | grep -Eqi '^https?://(127\.0\.0.1|localhost)'; then
            echo "::error::Playwright URL is not local loopback"
            exit 1
          fi
          npx playwright test tests/case-buttons.spec.ts --project=chromium

      - name: Upload case-buttons Playwright report
        if: always() && steps.meta.outputs.suite == 'pm-complete'
        uses: actions/upload-artifact@v4
        with:
          name: case-buttons-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Case-assign Playwright smoke (local only)
        if: steps.meta.outputs.suite == 'full'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_ENTER_TEST_MODE: "1"
          PLAYWRIGHT_P0A_CASE_RPC_SMOKE: "1"
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          export PLAYWRIGHT_TEST_EMAIL="$(cat "$RUNNER_TEMP/playwright-email.txt")"
          export PLAYWRIGHT_TEST_PASSWORD="$(cat "$RUNNER_TEMP/playwright-password.txt")"
          if echo "${VITE_SUPABASE_URL}" | grep -Eqi "${PRODUCTION_REF}"; then
            echo "::error::Playwright URL is production"
            exit 1
          fi
          if ! echo "${VITE_SUPABASE_URL}" | grep -Eqi '^https?://(127\.0\.0\.1|localhost)'; then
            echo "::error::Playwright URL is not local loopback"
            exit 1
          fi
          npx playwright test tests/smoke-cases-translator-update-rpc.spec.ts --project=chromium

      - name: Local Advisors (controlled ERROR only)
        if: steps.meta.outputs.suite == 'full'
        run: node scripts/isolation-assert-advisors-local.mjs

      - name: Quality gates + related unit tests (full)
        if: steps.meta.outputs.suite == 'full'
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          npm run check:encoding
          npm run check:sql-identifiers
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run \
            src/lib/case-assignment-patch.test.ts \
            src/lib/assignee-select.test.ts \
            src/lib/case-create-payload.test.ts \
            src/components/CollaborationTable.assignee.test.tsx
          node --test scripts/check-public-schema-types-contract.test.mjs

      - name: Tool-ui quality gates + call-site unit tests
        if: steps.meta.outputs.suite == 'tool-ui'
        run: |
          set -euo pipefail
          npm run check:encoding
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run \
            src/lib/case-tool-credentials-callsite.test.ts \
            src/lib/case-tool-credentials-persist.test.ts \
            src/lib/case-tool-credentials-guard.test.ts

      - name: Copy-tools quality gates + #85 guard unit tests
        if: steps.meta.outputs.suite == 'copy-tools'
        run: |
          set -euo pipefail
          npm run check:encoding
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run \
            src/lib/case-duplicate-tools.test.ts \
            src/lib/case-tool-credentials-guard.test.ts \
            src/lib/case-tool-credentials-persist.test.ts

      - name: Case-buttons quality gates + #89 copy-tools regression units
        if: steps.meta.outputs.suite == 'pm-complete'
        run: |
          set -euo pipefail
          npm run check:encoding
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run \
            src/lib/case-task-complete-access.test.ts \
            src/lib/case-create-outcome.test.ts \
            src/lib/case-duplicate-tools.test.ts \
            src/lib/assignment-position-completeness.test.ts

      - name: Maint-acl quality gates + Edge gate policy tests
        if: steps.meta.outputs.suite == 'maint-acl'
        run: |
          set -euo pipefail
          npm run check:encoding
          npm run check:sql-identifiers
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run supabase/functions/_shared/maintenance-gate-policy.test.ts
          node --test scripts/check-public-schema-types-contract.test.mjs

      - name: Public schema types contract (Database["public"] only)
        run: |
          set -euo pipefail
          # Limit generation to public; still compare structurally (not text diff).
          # Out of scope: __InternalSupabase, graphql_public, declaration order.
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/types.gen.ts"
          node scripts/check-public-schema-types-contract.mjs \
            src/integrations/supabase/types.ts \
            "$RUNNER_TEMP/types.gen.ts"

      - name: Cleanup local Supabase / Docker
        if: always()
        run: |
          set +e
          supabase stop --no-backup || true
          docker ps -aq --filter "label=com.supabase.cli.project" | xargs -r docker rm -f || true
          rm -rf "$RUNNER_TEMP/iso-keys" "$RUNNER_TEMP/supabase.env" \
            "$RUNNER_TEMP/playwright-password.txt" "$RUNNER_TEMP/playwright-email.txt" \
            "$RUNNER_TEMP"/iso-*-email.txt "$RUNNER_TEMP"/iso-*-password.txt \
            "$RUNNER_TEMP/types.gen.ts" || true
          echo "cleanup_done=1"
