# P0-D 封頂：GitHub runner 本機 Supabase PostgreSQL 17（不得連 production／不得建 Micro）
# 僅本隔離分支／PR 執行。
name: P0 isolated DB (local PG17)

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/isolation-replay-20260901]
  workflow_dispatch:

concurrency:
  group: p0-isolated-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-isolation:
    name: Local Supabase PG17 isolation suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'feat/isolation-replay-20260901' ||
      github.head_ref == 'feat/isolation-replay-20260901'
    env:
      PRODUCTION_REF: wshsmerltcakffllgyul
      EXPECTED_MIGRATION_COUNT: "166"
      EXPECTED_MAX_VERSION: "20260904004224"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — refuse production credentials / refs
        run: |
          set -euo pipefail
          echo "git_sha=${GITHUB_SHA}"
          echo "expected_migrations=${EXPECTED_MIGRATION_COUNT}"
          echo "expected_max_version=${EXPECTED_MAX_VERSION}"
          echo "remote Supabase access disabled"
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must not be set"
            exit 1
          fi
          if [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF must not be set"
            exit 1
          fi
          for v in \
            "${VITE_SUPABASE_URL:-}" \
            "${SUPABASE_URL:-}" \
            "${NEXT_PUBLIC_SUPABASE_URL:-}"
          do
            if echo "$v" | grep -Eqi "${PRODUCTION_REF}"; then
              echo "::error::production ref detected in env"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify CLI syntax (no guessing)
        run: |
          set -euo pipefail
          supabase --version
          supabase --help >/dev/null
          supabase start --help >/dev/null
          supabase db reset --help >/dev/null
          supabase db query --help >/dev/null
          supabase migration list --help >/dev/null
          supabase status --help >/dev/null
          supabase stop --help >/dev/null
          supabase gen types --help >/dev/null
          supabase db advisors --help >/dev/null
          supabase functions serve --help >/dev/null

      - name: Assert config.toml major_version = 17
        run: |
          set -euo pipefail
          grep -q 'major_version = 17' supabase/config.toml
          echo "postgres_major_version_config=17"

      - name: Install psql client (multi-statement SQL tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Start local Supabase (PostgreSQL 17)
        id: start
        run: |
          set -euo pipefail
          supabase start
          PG_VER=$(supabase db query --local "show server_version;" -o csv | tail -n 1 | tr -d '"' | cut -d. -f1)
          echo "postgres_major=${PG_VER}"
          echo "postgres_major=${PG_VER}" >> "$GITHUB_OUTPUT"
          if [ "${PG_VER}" != "17" ]; then
            echo "::error::CLI started PostgreSQL ${PG_VER}, expected 17 — refusing to downgrade"
            exit 1
          fi

      - name: Replay migrations from zero (db reset --local)
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
          COUNT=$(supabase db query --local "select count(*)::text from supabase_migrations.schema_migrations;" -o csv | tail -n 1 | tr -d '"')
          MAXV=$(supabase db query --local "select max(version) from supabase_migrations.schema_migrations;" -o csv | tail -n 1 | tr -d '"')
          echo "migration_count=${COUNT}"
          echo "migration_max=${MAXV}"
          test "${COUNT}" = "${EXPECTED_MIGRATION_COUNT}"
          test "${MAXV}" = "${EXPECTED_MAX_VERSION}"

      - name: P0 SQL suite 11/11
        run: node scripts/isolation-run-p0-sql.mjs

      - name: Capture local API endpoints (masked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iso-keys"
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          node scripts/isolation-read-local-status.mjs "$RUNNER_TEMP/supabase.env" "$RUNNER_TEMP/iso-keys"

      - name: Provision race users + dual-client race
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs micro3 "$RUNNER_TEMP/iso-keys")
          echo "race_creds_file_written=1"
          export MICRO3_RACE_CREDS_FILE="$CREDS"
          node scripts/dual-client-collab-race.mjs
          rm -f "$CREDS" || true

      - name: Data API / definer helper contract
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs micro3 "$RUNNER_TEMP/iso-keys")
          API_CREDS=$(mktemp)
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            fs.writeFileSync(process.argv[2], JSON.stringify({
              url:c.url, anonKey:c.anonKey, member:c.m1
            }));
            try { fs.unlinkSync(process.argv[1]); } catch {}
          ' "$CREDS" "$API_CREDS"
          chmod 600 "$API_CREDS"
          export MICRO3_API_CREDS_FILE="$API_CREDS"
          node scripts/micro3-definer-view-api-check.mjs
          rm -f "$API_CREDS" || true

      - name: Provision Playwright test personas
        run: |
          set -euo pipefail
          CREDS=$(node scripts/isolation-pipe-provision.mjs personas "$RUNNER_TEMP/iso-keys")
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            fs.writeFileSync(process.argv[2], c.exec.password);
            fs.writeFileSync(process.argv[3], c.exec.email);
            try { fs.unlinkSync(process.argv[1]); } catch {}
          ' "$CREDS" "$RUNNER_TEMP/playwright-password.txt" "$RUNNER_TEMP/playwright-email.txt"
          chmod 600 "$RUNNER_TEMP/playwright-password.txt"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Case-assign Playwright smoke (local only)
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_ENTER_TEST_MODE: "1"
          PLAYWRIGHT_P0A_CASE_RPC_SMOKE: "1"
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          export PLAYWRIGHT_TEST_EMAIL="$(cat "$RUNNER_TEMP/playwright-email.txt")"
          export PLAYWRIGHT_TEST_PASSWORD="$(cat "$RUNNER_TEMP/playwright-password.txt")"
          if echo "${VITE_SUPABASE_URL}" | grep -Eqi "${PRODUCTION_REF}"; then
            echo "::error::Playwright URL is production"
            exit 1
          fi
          if ! echo "${VITE_SUPABASE_URL}" | grep -Eqi '^https?://(127\.0\.0\.1|localhost)'; then
            echo "::error::Playwright URL is not local loopback"
            exit 1
          fi
          npx playwright test tests/smoke-cases-translator-update-rpc.spec.ts --project=chromium

      - name: Types regenerate vs repo
        run: |
          set -euo pipefail
          supabase gen types typescript --local > "$RUNNER_TEMP/types.gen.ts"
          if ! diff -u src/integrations/supabase/types.ts "$RUNNER_TEMP/types.gen.ts" > "$RUNNER_TEMP/types.diff"; then
            echo "::error::generated types differ from repo"
            head -n 100 "$RUNNER_TEMP/types.diff" || true
            exit 1
          fi
          echo "types_match=PASS"

      - name: Local Advisors (controlled ERROR only)
        run: node scripts/isolation-assert-advisors-local.mjs

      - name: Quality gates + related unit tests
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="$(cat "$RUNNER_TEMP/iso-keys/url.txt")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(cat "$RUNNER_TEMP/iso-keys/anon.key")"
          npm run check:encoding
          npm run check:sql-identifiers
          npm run check:forbidden-casts
          npm run typecheck
          npx vitest run \
            src/lib/case-assignment-patch.test.ts \
            src/lib/assignee-select.test.ts \
            src/lib/case-create-payload.test.ts \
            src/components/CollaborationTable.assignee.test.tsx

      - name: Cleanup local Supabase / Docker
        if: always()
        run: |
          set +e
          supabase stop --no-backup || true
          docker ps -aq --filter "label=com.supabase.cli.project" | xargs -r docker rm -f || true
          rm -rf "$RUNNER_TEMP/iso-keys" "$RUNNER_TEMP/supabase.env" \
            "$RUNNER_TEMP/playwright-password.txt" "$RUNNER_TEMP/playwright-email.txt" \
            "$RUNNER_TEMP/types.gen.ts" "$RUNNER_TEMP/types.diff" || true
          echo "cleanup_done=1"
