name: Migration history sentinel

# 正式庫 migration 版號 vs repo。
# - fixture／單元測試：由主 CI 的 npm test 擋關（tests/check-migration-history.test.ts）
# - 本 workflow live 檢查：非擋關（continue-on-error）；需 Secrets SUPABASE_ACCESS_TOKEN
#   建議：確認密鑰穩定兩週後，將 continue-on-error 改 false 升為擋關

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-migration-history.mjs"
      - ".github/workflows/migration-history.yml"

jobs:
  fixture-smoke:
    name: fixture drift detection（擋關）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Expect drift fixture to fail
        run: |
          set +e
          node scripts/check-migration-history.mjs --fixture tests/fixtures/migration-history-drift-repair-only.json
          test $? -eq 1
      - name: Expect synced fixture to pass
        run: node scripts/check-migration-history.mjs --fixture tests/fixtures/migration-history-synced.json

  live-remote:
    name: live repo ↔ production（非擋關）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Link and compare
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SKIP: 未設定 SUPABASE_ACCESS_TOKEN（live 非擋關）"
            exit 0
          fi
          REF="${SUPABASE_PROJECT_REF:-wshsmerltcakffllgyul}"
          npx supabase link --project-ref "$REF" --yes
          node scripts/check-migration-history.mjs --live
