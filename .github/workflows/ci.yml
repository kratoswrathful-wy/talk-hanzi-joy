name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck / test / lint / encoding / forbidden-casts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Encoding check (防中文編碼損壞)
        run: npm run check:encoding

      - name: SQL migration identifier check
        run: npm run check:sql-identifiers

      - name: Forbidden casts check (as unknown as / @ts-expect-error)
        run: npm run check:forbidden-casts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # 2026-07-07：.env 已移除版控追蹤（見 architecture.mdc §9），CI 改用 Secrets
          # 提供 src/integrations/supabase/client.ts 建立 client 所需的公開安全值（anon key）。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Lint
        run: npm run lint
