# Playwright e2e（慢軌、非擋關）
# 觸發：workflow_dispatch + nightly schedule + pull_request（不含 push main）
# 見 docs/ENGINEERING_IMPROVEMENT_MASTER_PLAN_2026-07.md §20
name: E2E (Playwright)

on:
  workflow_dispatch:
  schedule:
    # UTC 18:00 ≈ 台灣時間次日 02:00（nightly）
    - cron: "0 18 * * *"
  pull_request:

jobs:
  playwright:
    name: Playwright e2e（非擋關）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — skip if PLAYWRIGHT_TEST_PASSWORD missing
        id: guard
        env:
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          if [ -z "$PLAYWRIGHT_TEST_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAYWRIGHT_TEST_PASSWORD 未設定，略過 e2e（非擋關）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          PLAYWRIGHT_ENTER_TEST_MODE: "1"
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload playwright-report
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test-results
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
