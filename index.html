<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>系統維護中｜1UP</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --card: #fffcf7;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 600px at 10% -10%, #e7e5e4 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #d6ebe7 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
        line-height: 1.6;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .panel {
        width: min(36rem, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 18px 40px rgba(28, 25, 23, 0.06);
      }
      .brand {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin: 0 0 0.75rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.45rem, 4vw, 1.85rem);
        line-height: 1.25;
      }
      p { margin: 0 0 0.85rem; color: var(--muted); }
      .eta {
        margin-top: 1.1rem;
        padding: 0.85rem 1rem;
        border-left: 3px solid var(--accent);
        background: #f0fdfa;
        color: var(--ink);
      }
      .note {
        margin-top: 1.25rem;
        font-size: 0.92rem;
        color: var(--muted);
      }
      ul {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
        color: var(--muted);
      }
      li { margin: 0.35rem 0; }
    </style>
  </head>
  <body>
    <!--
      靜態維護頁：不載入 React／LMS／CAT／Auth／Supabase。
      預計恢復時間可由建置環境變數 MAINTENANCE_ETA 注入（非敏感字串）。
      本頁無法遠端關閉使用者先前已開啟的舊分頁。
    -->
    <main>
      <section class="panel" aria-labelledby="maint-title">
        <p class="brand">1UP TMS</p>
        <h1 id="maint-title">系統正在維護</h1>
        <p>目前無法登入或繼續使用 LMS／CAT。請停止操作，並關閉先前已開啟的相關分頁。</p>
        <p class="eta" id="maint-eta">預計恢復時間：__MAINTENANCE_ETA__</p>
        <p>如有急件，請聯絡 PM。</p>
        <div class="note">
          <strong>請注意</strong>
          <ul>
            <li>本頁僅通知並阻止新使用者進入，無法關閉您電腦上已開著的舊分頁。</li>
            <li>資料庫安全更新套用後，舊分頁若仍送出不相容寫入，會被新的權限規則拒絕。</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
